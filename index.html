<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/normalize.css"></link>
    <link rel="stylesheet" href="assets/vet.css"></link>
    <title>Gentle Paws Veterinary</title>
</head>
<body>
    <header>
        <h2>Gentle Paws Veterinary Clinic</h2>
    </header>
    <section class="parentSection">
        <section class="child">
            <section>
                <h1>Sorry, for the inconvenience we're currently closed</h1>
                <h2>If this is an emergency please enter your location and find the nearest Animal Hospital</h2>

                <input type="text" class="city" placeholder="Enter City"></input><input type="text" class="state" placeholder="Enter State Code"></input><button type="button" class="button">Enter</button>
            </section>
            <p class="results"></p>
        </section>
    </section>
    

    <script src="assets/vet.js"></script>

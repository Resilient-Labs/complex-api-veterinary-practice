<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/vet-api.css">
    <title>VET API APP</title>
</head>
<body>
    <div>Keeping your pet on the path to wellness.</div>
<section id="webApp">

    <h1><img src="img/vet-API-logo.avif" alt="pet hospital logo">Pet Hospital Locator</h1>
    <p>Add your zipcode to find the closest 3 hospitals within 10 miles</p>

    <label for="cityInput"></label>
    <input type="search" id="cityInput" name="q" />
    <button id="clickMe">Search</button>
    <section id="results">    
        <h3 class = option id="boxOne"></h3>
        <h3 class = option id="boxTwo"></h3>
        <h3 class = option id="boxThree"></h3>
    </section>
</section>



<script src="js/vet-api.js"></script>
</body>
</html>
